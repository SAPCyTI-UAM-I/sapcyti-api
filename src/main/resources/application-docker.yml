# Docker / Compose profile — externalized config (SPEC-009, SPEC-010)
# Activate with SPRING_PROFILES_ACTIVE=docker (set in Dockerfile and .env.docker.example)

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://db:5432/sapcyti_dev}
    username: ${DB_USER:sapcyti}
    password: ${DB_PASS}

server:
  port: ${SERVER_PORT:8080}

spring:
  mail:
    host: ${SMTP_HOST:mailhog}
    port: ${SMTP_PORT:1025}

app:
  password-reset:
    base-url: ${PASSWORD_RESET_BASE_URL:http://localhost:4200}

logging:
  level:
    root: INFO
    mx.uam.sapcyti: INFO

jwt:
  private-key-path: classpath:jwt/dev-private.pem
  public-key-path: classpath:jwt/dev-public.pem

management:
  endpoint:
    health:
      show-details: when_authorized
