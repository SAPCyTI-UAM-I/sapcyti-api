spring:
  application:
    name: sapcyti-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/sapcyti_dev}
    username: ${DB_USER:sapcyti}
    password: ${DB_PASS:sapcyti_dev_pass}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USER:}
    password: ${SMTP_PASS:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:false}
          starttls:
            enable: ${SMTP_STARTTLS:false}
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

server:
  port: ${SERVER_PORT:8081}

app:
  password-reset:
    base-url: ${PASSWORD_RESET_BASE_URL:http://localhost:4200}
    ttl-minutes: ${PASSWORD_RESET_TTL_MINUTES:30}
