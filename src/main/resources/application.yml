spring:
  application:
    name: sapcyti-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/sapcyti_dev}
    username: ${DB_USER:sapcyti}
    password: ${DB_PASS:sapcyti_dev_pass}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

server:
  port: ${SERVER_PORT:8081}
