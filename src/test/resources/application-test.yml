spring:
  datasource:
    url: jdbc:h2:mem:sapcyti;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
  sql:
    init:
      mode: never
  mail:
    host: localhost
    port: 1025

app:
  password-reset:
    base-url: http://localhost:4200
    ttl-minutes: 30

jwt:
  private-key-path: classpath:jwt/dev-private.pem
  public-key-path: classpath:jwt/dev-public.pem
