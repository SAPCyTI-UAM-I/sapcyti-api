spring:
  datasource:
    url: jdbc:h2:mem:sapcyti-auth;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false

jwt:
  private-key-path: classpath:jwt/dev-private.pem
  public-key-path: classpath:jwt/dev-public.pem
