name: PR Validation — Backend

on:
  pull_request:
    branches: [develop]

permissions:
  contents: read
  checks: write

jobs:
  lint:
    name: Lint (Checkstyle + Commitlint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Run Checkstyle
        run: mvn checkstyle:check -q

      - name: Set up Node.js (for commitlint)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install commitlint
        run: npm install

      - name: Validate commit messages
        run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }}

  build-and-test:
    name: Build & Test (Maven + JaCoCo)
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sapcyti_test
          POSTGRES_USER: sapcyti
          POSTGRES_PASSWORD: sapcyti_test_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sapcyti -d sapcyti_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build and test
        run: mvn clean verify -B
        env:
          DB_URL: jdbc:postgresql://localhost:5432/sapcyti_test
          DB_USER: sapcyti
          DB_PASS: sapcyti_test_pass
          SPRING_PROFILES_ACTIVE: test

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/

  security-scan:
    name: Security Scan (OWASP)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Run OWASP Dependency-Check
        run: mvn dependency-check:check -B
        continue-on-error: true

      - name: Upload OWASP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owasp-report
          path: target/dependency-check-report.html
