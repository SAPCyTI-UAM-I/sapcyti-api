name: Merge & Deploy — API

on:
  push:
    branches:
      - develop
      - main
      - 'release/*'

permissions:
  contents: read
  packages: write

jobs:
  ci-build:
    name: Build, Test & Package
    runs-on: ubuntu-latest
    outputs:
      env_name: ${{ steps.determine-env.outputs.env_name }}
      image_tag: ${{ steps.determine-env.outputs.image_tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Run Checkstyle Static Analysis
        run: mvn checkstyle:check

      - name: Run Unit and Integration Tests
        run: mvn clean test

      - name: Determine Target Environment & Image Tag
        id: determine-env
        run: |
          if [ "${{ github.ref }}" = "refs/heads/develop" ]; then
            echo "env_name=dev" >> $GITHUB_OUTPUT
            echo "image_tag=dev" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == "refs/heads/release/*" ]]; then
            echo "env_name=qa" >> $GITHUB_OUTPUT
            echo "image_tag=qa" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "env_name=prod" >> $GITHUB_OUTPUT
            echo "image_tag=prod" >> $GITHUB_OUTPUT
          fi
      
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN}}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/sapcyti-api:${{ steps.determine-env.outputs.image_tag }}

  cd-build:
    name: Invoke CD Engine
    needs: ci-build

    uses: SAPCyTI-UAM-I/sapcyti-infra/.github/workflows/cd-deploy.yml@main
    with:
      environment: ${{ needs.ci-build.outputs.env_name }}
      api_image: ghcr.io/${{ github.repository_owner }}/sapcyti-api:${{ needs.ci-build.outputs.image_tag }}
      spa_image: ghcr.io/${{ github.repository_owner }}/sapcyti-spa:${{ needs.ci-build.outputs.image_tag }}
    secrets:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_KEY: ${{ secrets.SSH_KEY }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
