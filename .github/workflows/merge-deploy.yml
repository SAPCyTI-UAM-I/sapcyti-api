name: Merge & Deploy — Backend

on:
  push:
    branches: [develop, main, 'release/*']

permissions:
  contents: read
  packages: write

jobs:
  build-and-test:
    name: Build, Test & Package
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sapcyti_test
          POSTGRES_USER: sapcyti
          POSTGRES_PASSWORD: sapcyti_test_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sapcyti -d sapcyti_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build and test
        run: mvn clean verify -B
        env:
          DB_URL: jdbc:postgresql://localhost:5432/sapcyti_test
          DB_USER: sapcyti
          DB_PASS: sapcyti_test_pass
          SPRING_PROFILES_ACTIVE: test

  docker-build:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/heads/release/')
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Package JAR
        run: mvn clean package -DskipTests -B

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:latest

