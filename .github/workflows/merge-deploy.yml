name: Merge & Deploy — API

on:
  push:
    branches:
      - develop
      - main
      - 'release/*'

permissions:
  contents: read
  packages: write

jobs:
  ci-build:
    name: Build, Test & Package
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sapcyti_test
          POSTGRES_USER: sapcyti
          POSTGRES_PASSWORD: sapcyti_test_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sapcyti -d sapcyti_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    outputs:
      env_name: ${{ steps.determine-env.outputs.env_name }}
      image_tag: ${{ steps.determine-env.outputs.image_tag }}
      image_owner: ${{ steps.determine-env.outputs.image_owner }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.0

      - name: Set up JDK 21
        uses: actions/setup-java@v5.3.0
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Run Checkstyle Static Analysis
        run: mvn checkstyle:check -q

      - name: Run Unit and Integration Tests
        run: mvn clean verify -B
        env:
          DB_URL: jdbc:postgresql://localhost:5432/sapcyti_test
          DB_USER: sapcyti
          DB_PASS: sapcyti_test_pass
          SPRING_PROFILES_ACTIVE: test

      - name: Determine Target Environment & Image Tag
        id: determine-env
        run: |
          ENV_NAME=""
          IMAGE_TAG=""
          if [ "${{ github.ref }}" = "refs/heads/develop" ]; then
            ENV_NAME="dev"
            IMAGE_TAG="dev"
          elif [[ "${{ github.ref }}" == refs/heads/release/* ]]; then
            ENV_NAME="qa"
            IMAGE_TAG="qa"
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            ENV_NAME="prod"
            IMAGE_TAG="prod"
          fi

          if [ -z "$ENV_NAME" ]; then
            echo "❌ Error: Could not determine target environment for ref ${{ github.ref }}"
            exit 1
          fi

          IMAGE_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')

          echo "env_name=$ENV_NAME" >> $GITHUB_OUTPUT
          echo "image_tag=$IMAGE_TAG" >> $GITHUB_OUTPUT
          echo "image_owner=$IMAGE_OWNER" >> $GITHUB_OUTPUT
      
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN}}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v7.2.0
        with:
          context: .
          push: true
          tags: ghcr.io/${{ steps.determine-env.outputs.image_owner }}/sapcyti-api:${{ steps.determine-env.outputs.image_tag }}

  cd-build:
    name: Invoke CD Engine
    needs: ci-build

    uses: SAPCyTI-UAM-I/sapcyti-infra/.github/workflows/cd-deploy.yml@main
    with:
      environment: ${{ needs.ci-build.outputs.env_name }}
      api_image: ghcr.io/${{ needs.ci-build.outputs.image_owner }}/sapcyti-api:${{ needs.ci-build.outputs.image_tag }}
      spa_image: ghcr.io/${{ needs.ci-build.outputs.image_owner }}/sapcyti-spa:${{ needs.ci-build.outputs.image_tag }}
    secrets:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_KEY: ${{ secrets.SSH_KEY }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}